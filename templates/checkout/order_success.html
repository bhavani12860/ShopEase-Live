<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - ShopEase</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f6;
            color: #212121;
        }

        /* ================================
           NAVBAR
        ================================= */

        .navbar {
            height: 70px;
            background: #2874f0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            color: white;
            text-decoration: none;

            font-size: 30px;
            font-weight: 800;
            font-style: italic;
        }

        .logo span {
            color: #ffe500;
        }

        .secure {
            color: white;
            font-size: 16px;
            font-weight: 600;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ================================
           SUCCESS CARD
        ================================= */

        .success-container {

            width: 90%;
            max-width: 850px;

            margin: 60px auto;

            background: white;

            border-radius: 8px;

            padding: 55px 45px;

            text-align: center;

            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        /* ================================
           SUCCESS ICON
        ================================= */

        .success-icon {

            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #28a745;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;
        }

        /* ================================
           TITLE
        ================================= */

        h1 {

            margin: 0 0 15px;

            font-size: 32px;

            color: #212121;
        }

        .order-id {

            font-size: 18px;

            color: #555;

            margin-bottom: 18px;
        }

        .order-id strong {

            color: #2874f0;
        }

        .message {

            color: #777;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 35px;
        }

        /* ================================
           BUTTONS
        ================================= */

        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .btn {

            min-width: 210px;

            padding: 14px 24px;

            border-radius: 4px;

            text-decoration: none;

            font-size: 16px;

            font-weight: 700;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            cursor: pointer;
        }

        .primary {

            background: #2874f0;

            color: white;

            border: 1px solid #2874f0;
        }

        .primary:hover {

            background: #1665d8;
        }

        .secondary {

            background: white;

            color: #2874f0;

            border: 1px solid #2874f0;
        }

        .secondary:hover {

            background: #f1f7ff;
        }

        /* ================================
           ORDER INFO
        ================================= */

        .info-box {

            margin-top: 30px;

            padding: 18px;

            background: #f8f9fa;

            border-radius: 5px;

            color: #555;

            font-size: 14px;
        }

        .info-box i {

            color: #28a745;

            margin-right: 5px;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 25px;
            }

            .secure {
                font-size: 13px;
            }

            .success-container {

                width: 94%;

                margin: 30px auto;

                padding: 40px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<header class="navbar">

    <a
        href="{{ url_for('home') }}"
        class="logo"
    >
        Shop<span>Ease</span>
    </a>


    <div class="secure">

        <i class="fa-solid fa-lock"></i>

        Secure Shopping

    </div>

</header>


<!-- =========================================
     SUCCESS
========================================= -->

<div class="success-container">


    <div class="success-icon">

        <i class="fa-solid fa-check"></i>

    </div>


    <h1>
        Order Confirmed!
    </h1>


    <div class="order-id">

        Order ID:

        <strong>
            #SE{{ order_id }}
        </strong>

    </div>


    <p class="message">

        Thank you for shopping with ShopEase.<br>

        Your order has been placed successfully.

    </p>


    <!-- =====================================
         BUTTONS
    ====================================== -->

    <div class="buttons">


        <!-- IMPORTANT:
             orders.order_details
             NOT checkout.order_details
        -->

        <a
            href="{{ url_for('orders.order_details', order_id=order_id) }}"
            class="btn primary"
        >

            <i class="fa-solid fa-file-lines"></i>

            View Order Details

        </a>


        <a
            href="{{ url_for('orders.track_order', order_id=order_id) }}"
            class="btn primary"
        >

            <i class="fa-solid fa-truck"></i>

            Track Order

        </a>


        <a
            href="{{ url_for('home') }}"
            class="btn secondary"
        >

            <i class="fa-solid fa-cart-shopping"></i>

            Continue Shopping

        </a>

    </div>


    <div class="info-box">

        <i class="fa-solid fa-circle-check"></i>

        Your order details are safely saved in your ShopEase account.

    </div>


</div>


</body>

</html>
